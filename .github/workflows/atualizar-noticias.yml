name: Atualizar notícias
on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node bot/buscar-noticias.mjs
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      - name: Salvar mudanças
        run: |
          git config user.name "robo-lagaz"
          git config user.email "robo-lagaz@users.noreply.github.com"
          git add noticias.json
          git diff --staged --quiet || (git commit -m "Atualiza notícias" && git push)
